name: bloomspeech
description: "Response Cost Therapy app for speech-language pathologists treating children who stutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Supabase (Primary Backend)
  supabase_flutter: ^2.8.0

  # Local Storage (Offline-first)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Charts
  fl_chart: ^0.70.2

  # PDF & Sharing
  pdf: ^3.11.2
  printing: ^5.13.5
  share_plus: ^10.1.4
  path_provider: ^2.1.5

  # Audio
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.0

  # Video Calling & Launching
  url_launcher: ^6.3.1
  jitsi_meet_flutter_sdk: ^13.0.0
  permission_handler: ^12.0.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  confetti: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
    - assets/animations/

  # Fonts: Poppins is loaded via google_fonts package at runtime.
  # To add NotoSansKannada for offline Kannada support, download the font files
  # to assets/fonts/ and uncomment below:
  # fonts:
  #   - family: NotoSansKannada
  #     fonts:
  #       - asset: assets/fonts/NotoSansKannada-Regular.ttf
  #       - asset: assets/fonts/NotoSansKannada-Bold.ttf
  #         weight: 700
